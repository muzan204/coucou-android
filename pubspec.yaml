name: coucou_android
description: Coucou Projects Hub - GitHub, Termux, sites e APKs em um só app.
publish_to: "none"
version: 4.0.0+40

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_overlay_window: ^0.5.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.jpg
    - assets/brand/app_icon.jpg
    - assets/brand/mascot.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.jpg
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/brand/app_icon.jpg
