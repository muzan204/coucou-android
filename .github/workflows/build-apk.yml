name: Build & Publish Coucou APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: coucou-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Guardar arquivos Coucou
        run: |
          cp -r lib /tmp/coucou-lib
          cp -r assets /tmp/coucou-assets
          cp pubspec.yaml /tmp/coucou-pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/coucou-AndroidManifest.xml
          cp android/app/src/main/kotlin/com/meraky/coucou_android/MainActivity.kt /tmp/coucou-MainActivity.kt

      - name: Completar estrutura Flutter Android
        run: flutter create --overwrite --platforms=android --org com.meraky --project-name coucou_android .

      - name: Restaurar arquivos Coucou
        run: |
          rm -rf lib assets
          cp -r /tmp/coucou-lib lib
          cp -r /tmp/coucou-assets assets
          cp /tmp/coucou-pubspec.yaml pubspec.yaml
          cp /tmp/coucou-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/meraky/coucou_android
          cp /tmp/coucou-MainActivity.kt android/app/src/main/kotlin/com/meraky/coucou_android/MainActivity.kt

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar ícone do aplicativo
        run: dart run flutter_launcher_icons

      - name: Verificar Flutter
        run: |
          flutter doctor -v
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK atualizado
        run: |
          flutter build apk --release \
            --build-name "4.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Preparar atualização
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk coucou-latest.apk
          cat > version.json <<EOF
          {
            "version": "4.0.${{ github.run_number }}",
            "build": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "notes": "Atualização automática do Coucou Projects Hub."
          }
          EOF

      - name: Atualizar tag rolling
        run: |
          git tag -f coucou-latest "${{ github.sha }}"
          git push origin refs/tags/coucou-latest --force

      - name: Publicar Release automática
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view coucou-latest >/dev/null 2>&1; then
            gh release edit coucou-latest \
              --title "Coucou Projects Hub 4.0.${{ github.run_number }}" \
              --notes "Build automático do commit ${{ github.sha }}."
            gh release upload coucou-latest coucou-latest.apk version.json --clobber
          else
            gh release create coucou-latest \
              coucou-latest.apk version.json \
              --title "Coucou Projects Hub 4.0.${{ github.run_number }}" \
              --notes "Canal automático de atualização do Coucou."
          fi

      - name: Salvar APK também como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coucou-projects-hub-v3
          path: coucou-latest.apk
